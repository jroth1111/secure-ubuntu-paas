version: 1
id: dflow
display_name: "dFlow"
depends_on: [docker-host]
state_namespace: /var/lib/server-hardening/overlays/dflow
modules:
  bootstrap:
    - modules/tailscale_ssh.sh
    - modules/predeploy_hook.sh
  validate:
    - {file: checks/dflow_substrate_check.sh, gate_c: false}
    - {file: checks/dflow_dokku_check.sh, gate_c: true}
    - {file: checks/dflow_beszel_check.sh, gate_c: true}
    - {file: checks/dflow_backups_check.sh, gate_c: true}
    - {file: checks/dflow_predeploy_hook_check.sh, gate_c: true}
companion_scripts: []
